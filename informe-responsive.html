<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Copiar tablas</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px; }
        button {
            background: #0052FF;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #0038B8; }
        button.copiado { background: #16A34A; }
    </style>
</head>
<body>
    <button onclick="copiar()">Copiar tablas</button>

    <script>
function copiar() {
    const texto = `Móvil (≤480px)
Elemento	Problema
Hero	Mantiene 720px de alto y tipografía de 64px (desborda horizontal)
Título hero	white-space: nowrap impide que el texto salte de línea
Menú	No se aplica ningún cambio (queda el de escritorio)
Footer	Se queda en 4 columnas con altura fija (382px) en vez de apilarse
Carrusel	Mantiene 702px de alto y paddings de 32px
Catálogo	Hero de 560px y cuadrícula de 1534px (no se adapta)
Servicios	Heroes de 577px con tipografía de 64px
Recambios	Hero de 560px, tipografía de 64px
Formulario recambios	Cuadrícula en 2 columnas de 688px en vez de 1 columna

Tablet (≤768px)
Elemento	Problema
Menú	No se colapsa, se queda en fila horizontal
Botón hamburguesa	Se oculta (display: none) en vez de mostrarse
Hero	Mantiene 720px de alto y 64px de tipografía
Footer	Se queda en 4 columnas en vez de 2
Carrusel	Mantiene dimensiones de escritorio
Catálogo	Hero de 560px, cuadrícula de 1534px
Servicios	Heroes de 577px
Formulario recambios	Cuadrícula en 2 columnas de 688px`;

    navigator.clipboard.writeText(texto).then(() => {
        const btn = document.querySelector('button');
        btn.textContent = '✓ Copiado';
        btn.classList.add('copiado');
        setTimeout(() => {
            btn.textContent = 'Copiar tablas';
            btn.classList.remove('copiado');
        }, 2000);
    });
}
    </script>
</body>
</html>
